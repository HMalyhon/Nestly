# Vite fingerprints everything under /assets, so a name change is the only way their contents
# change; index.html names those bundles, so caching it pins a returning visitor to whichever
# deploy they first saw. Chosen here rather than per location because a location that sets any
# add_header of its own drops every one inherited from the server, security headers included.
map $uri $nestly_cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The version is in the banner otherwise, which only helps someone matching it to an advisory.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $nestly_cache_control always;

    # The app loads its own bundles, inline styles from Emotion, and map tiles from OpenStreetMap.
    # Everything else, including anything a listing's text might smuggle in, has nowhere to go.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Not no-referrer: OpenStreetMap serves a "blocked" tile to callers it cannot identify, and
    # the origin is all it needs. The path and query, which carry what someone searched for, are
    # never sent cross-origin either way.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The whole search lives in one route's query string, so every path has to return the app
    # rather than a 404 from the filesystem.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same origin as the app, which is why the client sends no preflight and needs no absolute
    # API URL. No trailing slash on the target: the API's own routes start with /api.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold search embeds the query before it reaches Elasticsearch; the default 60s is
        # generous either way, but a failed proxy read is a worse error than a slow answer.
        proxy_read_timeout 90s;
    }
}
