server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these, so a name change is the only way their contents change.
    location /assets/ {
        # One header, not `expires` as well: that directive emits a Cache-Control of its own and
        # the response goes out carrying two of them.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The whole search lives in one route's query string, so every path has to return the app
    # rather than a 404 from the filesystem.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html names the hashed bundles, so caching it pins a returning visitor to whichever
        # deploy they first saw. It is the one file here that has to be revalidated every time.
        add_header Cache-Control "no-cache";
    }

    # Same origin as the app, which is why the client sends no preflight and needs no absolute
    # API URL. No trailing slash on the target: the API's own routes start with /api.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold search embeds the query before it reaches Elasticsearch; the default 60s is
        # generous either way, but a failed proxy read is a worse error than a slow answer.
        proxy_read_timeout 90s;
    }
}
