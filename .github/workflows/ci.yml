name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the run already in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # From global.json, which pins the feature band. The repo builds warnings-as-errors with
      # analysers on, so a newer band's new rules would fail a checkout nobody had changed.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-

      - run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test --project tests/Nestly.UnitTests/Nestly.UnitTests.csproj --no-build -c Release

      # Keyed on the digests rather than a version, because the digests are what the fetcher
      # verifies: change one and the cache misses, which is exactly when it should.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('tools/Nestly.ModelFetcher/appsettings.json') }}

      # Without the model the vector tests skip themselves, and the one test that proves the
      # hybrid layer earns its keep is the first thing that would quietly stop running.
      - name: Fetch the embedding model
        run: dotnet run --project tools/Nestly.ModelFetcher --no-build -c Release

      # Testcontainers starts a real Elasticsearch 9.2.0; ubuntu-latest already has a daemon.
      - name: Integration tests
        run: dotnet test --project tests/Nestly.IntegrationTests/Nestly.IntegrationTests.csproj --no-build -c Release

  web:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Nestly.Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Nestly.Web/package-lock.json

      - run: npm ci

      # `npm run build` is lint, then typecheck, then bundle. One script, and the same one the
      # web image runs, so CI cannot pass on something the image would reject.
      - name: Lint, typecheck and build
        run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # The build is the test: the API image publishes with analysers on and downloads the model
      # against its recorded digest, and the web image runs the same lint and typecheck as above.
      - name: Build the images
        run: docker compose build
