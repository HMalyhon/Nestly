name: nestly

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: nestly-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=nestly

      # Security is off because this is a throwaway local demo cluster with no
      # data worth protecting. Never do this anywhere real.
      - xpack.security.enabled=false

      # Pinned explicitly rather than left to the default. Basic is free and
      # perpetual; a self-generated *trial* would unlock the paid retrievers and
      # then expire after 30 days, breaking the demo for anyone who clones this
      # repo later. Nestly deliberately uses no feature above Basic.
      - xpack.license.self_generated.type=basic

      # No ELSER, no inference endpoints, no anomaly detection here -- embeddings
      # are generated in .NET. Turning ML off saves ~1GB of heap and a chunk of
      # startup time.
      - xpack.ml.enabled=false

      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      # Dependent services wait on this, so it must report genuine query
      # readiness -- not just an open socket.
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    image: nestly-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: nestly-api
    environment:
      - Elasticsearch__Uri=http://elasticsearch:9200

      # nginx forwards /api on the app's own origin, so the browser never makes a cross-origin
      # request and no origin needs allowing. The list stays for `npm run dev`, which does.
      - Cors__AllowedOrigins__0=http://localhost:8080
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      # 8080 inside, which is what the aspnet images already default to; 5080 outside, so the web
      # tier can have 8080 on the host without the two contending for it.
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  seeder:
    image: nestly-api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: nestly-seeder

    # The same image as the API with a different entrypoint: both need the 90 MB model, and a
    # second image would only carry a second copy of it.
    working_dir: /app/seeder
    entrypoint: ["dotnet", "Nestly.Seeder.dll"]
    environment:
      - Elasticsearch__Uri=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

    # Runs once and stops. Without this Compose would treat the exit as a crash and start it
    # again, re-indexing the whole dataset every time.
    restart: "no"

  web:
    image: nestly-web
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: nestly-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  elasticsearch-data:
